publishing {
    publications {
        library(MavenPublication) {
            from components.java
            groupId = 'ru.capitalbank'
            artifactId = 'TestContainerKafkaStarter'
//
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }
    repositories {
        mavenLocal() // Это указывает Gradle загружать артефакт в локальный Maven репозиторий (~/.m2/repository)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-configuration-processor'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.kafka:kafka-clients'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.testcontainers:kafka'
    implementation 'org.testcontainers:testcontainers'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.bootJar {
    archiveBaseName.set("TestContainerKafkaStarter")
    archiveVersion.set("0.0.1")

    manifest {
        attributes.remove("Main") // Удаляем main-класс
    }
}
